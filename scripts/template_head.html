<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sam's Chi-Fi Notes — Budget In-Ear Monitor Guide &amp; Bench</title>
  
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Modern Designer Fonts: Inter (body) + Bricolage Grotesque (display) + JetBrains Mono (data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['"Bricolage Grotesque"', '"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            studio: {
              950: '#0e0f13',
              900: '#14151b',
              850: '#1a1c24',
              800: '#222530',
              700: '#2d3140',
              600: '#3e4357',
              border: '#2a2e3d'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      background-color: #0e0f13;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
    }
    
    /* Tactile studio card */
    .studio-card {
      background-color: #14151b;
      border: 1px solid #242735;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .studio-card:hover {
      border-color: #3b4259;
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.6);
    }
    
    /* Clickable tactile button */
    .btn-tactile {
      transition: all 0.15s ease;
      user-select: none;
    }
    .btn-tactile:active {
      transform: scale(0.97);
    }
    
    /* Clean custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0e0f13;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2a2e3d;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #3e4357;
    }
    
    /* Equalizer animation for playing sound bench */
    @keyframes eqBar1 { 0%, 100% { height: 4px; } 50% { height: 18px; } }
    @keyframes eqBar2 { 0%, 100% { height: 16px; } 50% { height: 6px; } }
    @keyframes eqBar3 { 0%, 100% { height: 8px; } 50% { height: 22px; } }
    @keyframes eqBar4 { 0%, 100% { height: 20px; } 50% { height: 10px; } }
    @keyframes eqBar5 { 0%, 100% { height: 6px; } 50% { height: 16px; } }
    .eq-bar {
      width: 3px;
      border-radius: 2px;
      background-color: #38bdf8;
      height: 4px;
      transition: height 0.2s ease;
      display: inline-block;
    }
    .playing-bars .eq-bar:nth-child(1) { animation: eqBar1 0.7s infinite ease-in-out; }
    .playing-bars .eq-bar:nth-child(2) { animation: eqBar2 0.55s infinite ease-in-out; }
    .playing-bars .eq-bar:nth-child(3) { animation: eqBar3 0.65s infinite ease-in-out; }
    .playing-bars .eq-bar:nth-child(4) { animation: eqBar4 0.5s infinite ease-in-out; }
    .playing-bars .eq-bar:nth-child(5) { animation: eqBar5 0.6s infinite ease-in-out; }
    
    /* Vintage cassette/disc rotation */
    @keyframes spinReel { 100% { transform: rotate(360deg); } }
    .spinning-disc { animation: spinReel 3s linear infinite; }
  </style>
</head>
<body class="min-h-screen custom-scrollbar antialiased selection:bg-amber-400 selection:text-black">
