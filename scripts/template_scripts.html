  <script>
    const iemsData = __JSON_DATA__;
    let currentFilter = 'all';
    let currentSort = 'score-desc';
    let searchQuery = '';
    let viewingSharedOnly = false;
    let currentModalIemId = null;

    // Confetti Helper
    function fireConfetti(x = 0.5, y = 0.7) {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 35,
          spread: 55,
          origin: { x, y },
          colors: ['#fbbf24', '#f59e0b', '#38bdf8', '#34d399', '#f43f5e'],
          disableForReducedMotion: true
        });
      }
    }

    // Load Shortlist from LocalStorage or URL params
    let shortlist = JSON.parse(localStorage.getItem('iem_radar_shortlist') || '[]');
    let personalNotes = JSON.parse(localStorage.getItem('iem_radar_notes') || '{}');

    // Parse URL params for shared picks
    const urlParams = new URLSearchParams(window.location.search);
    const sharedPicksParam = urlParams.get('picks');
    let sharedPicks = [];
    if (sharedPicksParam) {
      sharedPicks = sharedPicksParam.split(',').map(s => s.trim().toLowerCase());
      if (sharedPicks.length > 0) {
        document.getElementById('shared-picks-banner').classList.remove('hidden');
      }
    }

    // DOM Elements
    const cardsView = document.getElementById('cards-view');
    const tableView = document.getElementById('table-view');
    const tableBody = document.getElementById('table-body');
    const emptyState = document.getElementById('empty-state');
    const resultsCountText = document.getElementById('results-count-text');
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const sortSelect = document.getElementById('sort-select');
    const filterPills = document.querySelectorAll('.filter-pill');
    const viewCardsBtn = document.getElementById('view-cards-btn');
    const viewTableBtn = document.getElementById('view-table-btn');
    const wishlistDrawer = document.getElementById('wishlist-drawer');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const openWishlistTopBtn = document.getElementById('open-wishlist-top-btn');
    const closeWishlistBtn = document.getElementById('close-wishlist-btn');
    const wishlistCounterBadge = document.getElementById('wishlist-counter-badge');
    const drawerCountLabel = document.getElementById('drawer-count-label');
    const wishlistItemsContainer = document.getElementById('wishlist-items-container');
    const copyShareUrlBtn = document.getElementById('copy-share-url-btn');
    const clearAllWishlistBtn = document.getElementById('clear-all-wishlist-btn');

    // Modal Elements
    const detailModal = document.getElementById('iem-detail-modal');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const modalImage = document.getElementById('modal-image');
    const modalBrand = document.getElementById('modal-brand');
    const modalTitle = document.getElementById('modal-title');
    const modalSoundDetail = document.getElementById('modal-sound-detail');
    const modalDriver = document.getElementById('modal-driver');
    const modalNozzle = document.getElementById('modal-nozzle');
    const modalCable = document.getElementById('modal-cable');
    const modalAccessories = document.getElementById('modal-accessories');
    const modalNoteInput = document.getElementById('modal-note-input');
    const saveNoteBtn = document.getElementById('save-note-btn');
    const modalStoresContainer = document.getElementById('modal-stores-container');

    // Search and Filter Listeners
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      clearSearchBtn.classList.toggle('hidden', !searchQuery);
      render();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      render();
    });

    sortSelect.addEventListener('change', (e) => {
      currentSort = e.target.value;
      render();
    });

    filterPills.forEach(pill => {
      pill.addEventListener('click', () => {
        filterPills.forEach(p => {
          p.classList.remove('active', 'bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
          p.classList.add('bg-studio-900', 'text-slate-300', 'border-studio-border');
        });
        pill.classList.add('active', 'bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
        pill.classList.remove('bg-studio-900', 'text-slate-300', 'border-studio-border');
        currentFilter = pill.dataset.filter;
        render();
      });
    });

    document.getElementById('reset-filters-btn').addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearSearchBtn.classList.add('hidden');
      currentFilter = 'all';
      filterPills.forEach(p => {
        if (p.dataset.filter === 'all') {
          p.classList.add('active', 'bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
          p.classList.remove('bg-studio-900', 'text-slate-300', 'border-studio-border');
        } else {
          p.classList.remove('active', 'bg-amber-400', 'text-black', 'font-bold', 'border-amber-400');
          p.classList.add('bg-studio-900', 'text-slate-300', 'border-studio-border');
        }
      });
      render();
    });

    // View Switching
    viewCardsBtn.addEventListener('click', () => {
      viewCardsBtn.classList.add('bg-amber-400', 'text-black', 'font-bold');
      viewCardsBtn.classList.remove('text-slate-400');
      viewTableBtn.classList.remove('bg-amber-400', 'text-black', 'font-bold');
      viewTableBtn.classList.add('text-slate-400');
      cardsView.classList.remove('hidden');
      tableView.classList.add('hidden');
    });

    viewTableBtn.addEventListener('click', () => {
      viewTableBtn.classList.add('bg-amber-400', 'text-black', 'font-bold');
      viewTableBtn.classList.remove('text-slate-400');
      viewCardsBtn.classList.remove('bg-amber-400', 'text-black', 'font-bold');
      viewCardsBtn.classList.add('text-slate-400');
      tableView.classList.remove('hidden');
      cardsView.classList.add('hidden');
    });

    // Shared picks actions
    document.getElementById('filter-shared-only-btn').addEventListener('click', () => {
      viewingSharedOnly = true;
      render();
    });
    document.getElementById('clear-shared-view-btn').addEventListener('click', () => {
      viewingSharedOnly = false;
      render();
    });

    // Shortlist Logic
    function updateShortlistUI() {
      wishlistCounterBadge.textContent = shortlist.length;
      drawerCountLabel.textContent = `${shortlist.length} item${shortlist.length === 1 ? '' : 's'} saved`;

      if (shortlist.length === 0) {
        wishlistItemsContainer.innerHTML = `
          <div class="text-center py-12 text-slate-400 space-y-2">
            <i class="fa-regular fa-bookmark text-2xl text-slate-400"></i>
            <p class="text-sm">Your saved shortlist is empty.</p>
            <p class="text-xs text-slate-400">Tap the bookmark icon on any IEM card to save it here.</p>
          </div>
        `;
        return;
      }

      const savedItems = iemsData.filter(i => shortlist.includes(i.id));
      wishlistItemsContainer.innerHTML = savedItems.map(item => {
        const note = personalNotes[item.id] || '';
        return `
          <div class="p-3.5 rounded-xl bg-studio-950 border border-studio-border flex flex-col gap-2">
            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center space-x-3 min-w-0">
                <img src="${item.image || 'assets/images/' + item.id + '.jpg'}" alt="${item.name}" class="w-12 h-12 rounded-lg object-contain bg-studio-900 border border-studio-border p-1 shrink-0">
                <div class="min-w-0">
                  <h4 class="text-base font-bold text-white truncate">${item.name}</h4>
                  <span class="text-xs font-mono text-amber-400">~€${item.price_eur_amazon} (Amazon) • ~€${item.price_eur_ali_1111} (11.11)</span>
                </div>
              </div>
              <button type="button" onclick="removeFromShortlist('${item.id}')" aria-label="Remove item" class="w-7 h-7 rounded-md bg-studio-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition shrink-0">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
            ${note ? `
              <div class="text-sm p-2 rounded bg-studio-900 text-slate-200 italic border border-studio-border">
                "${note}"
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    window.toggleShortlist = function(id, event) {
      if (event) event.stopPropagation();
      const idx = shortlist.indexOf(id);
      if (idx > -1) {
        shortlist.splice(idx, 1);
      } else {
        shortlist.push(id);
        fireConfetti(0.85, 0.2);
      }
      localStorage.setItem('iem_radar_shortlist', JSON.stringify(shortlist));
      updateShortlistUI();
      render();
    };

    window.removeFromShortlist = function(id) {
      const idx = shortlist.indexOf(id);
      if (idx > -1) {
        shortlist.splice(idx, 1);
        localStorage.setItem('iem_radar_shortlist', JSON.stringify(shortlist));
        updateShortlistUI();
        render();
      }
    };

    clearAllWishlistBtn.addEventListener('click', () => {
      if (confirm('Clear all saved IEMs from your shortlist?')) {
        shortlist = [];
        localStorage.setItem('iem_radar_shortlist', JSON.stringify(shortlist));
        updateShortlistUI();
        render();
      }
    });

    copyShareUrlBtn.addEventListener('click', () => {
      if (shortlist.length === 0) {
        copyShareUrlBtn.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-300"></i><span>Shortlist is empty!</span>';
        setTimeout(() => {
          copyShareUrlBtn.innerHTML = '<i class="fa-solid fa-share-nodes"></i><span>Copy Shareable Link</span>';
        }, 2000);
        return;
      }
      const shareUrl = `${window.location.origin}${window.location.pathname}?picks=${shortlist.join(',')}`;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(() => {
          copyShareUrlBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>Link Copied to Clipboard!</span>';
          setTimeout(() => {
            copyShareUrlBtn.innerHTML = '<i class="fa-solid fa-share-nodes"></i><span>Copy Shareable Link</span>';
          }, 2500);
        }).catch(err => {
          console.warn('Clipboard write failed, using prompt fallback:', err);
          prompt('Copy this shareable link:', shareUrl);
        });
      } else {
        prompt('Copy this shareable link:', shareUrl);
      }
    });

    // Drawer Controls
    function openDrawer() {
      wishlistDrawer.classList.remove('translate-x-full');
      drawerBackdrop.classList.remove('hidden');
      updateShortlistUI();
    }
    function closeDrawer() {
      wishlistDrawer.classList.add('translate-x-full');
      drawerBackdrop.classList.add('hidden');
    }
    openWishlistTopBtn.addEventListener('click', openDrawer);
    closeWishlistBtn.addEventListener('click', closeDrawer);
    drawerBackdrop.addEventListener('click', closeDrawer);

    // Modal Dialog Controls
    window.openModal = function(id) {
      const item = iemsData.find(i => i.id === id);
      if (!item) return;
      currentModalIemId = id;

      modalBrand.textContent = item.brand;
      modalTitle.textContent = item.name;
      modalImage.src = item.image || `assets/images/${item.id}.jpg`;
      modalSoundDetail.textContent = item.takeaway || item.sound_description;
      modalDriver.textContent = `${item.driver_type} (${item.driver_detail || 'Dynamic'})`;
      modalNozzle.textContent = `${item.nozzle_diameter_mm}mm (${item.comfort_rating >= 9.2 ? 'Small ear safe' : 'Standard bore'})`;
      modalCable.textContent = item.cable_detail || item.connection;
      modalAccessories.textContent = item.accessories_included || 'Silicone tips, pouch';

      modalNoteInput.value = personalNotes[id] || '';

      modalStoresContainer.innerHTML = (item.verified_stores || []).map(store => `
        <a href="${store.url}" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded-lg bg-studio-950 hover:bg-studio-800 text-slate-200 border border-studio-border text-sm font-mono font-semibold transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrow-up-right-from-square text-xs text-amber-400"></i>
          <span>${store.name}</span>
        </a>
      `).join('');

      detailModal.classList.remove('hidden');
      detailModal.classList.add('flex');
      detailModal.showModal();
    };

    function hideModal() {
      detailModal.close();
      detailModal.classList.remove('flex');
      detailModal.classList.add('hidden');
    }

    closeModalBtn.addEventListener('click', hideModal);
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) hideModal();
    });

    saveNoteBtn.addEventListener('click', () => {
      if (!currentModalIemId) return;
      const note = modalNoteInput.value.trim();
      if (note) {
        personalNotes[currentModalIemId] = note;
      } else {
        delete personalNotes[currentModalIemId];
      }
      localStorage.setItem('iem_radar_notes', JSON.stringify(personalNotes));
      saveNoteBtn.textContent = 'Saved!';
      setTimeout(() => { saveNoteBtn.textContent = 'Save'; }, 1500);
      render();
      updateShortlistUI();
    });

    // Render Filtered Cards & Table
    function render() {
      let filtered = iemsData.filter(iem => {
        if (viewingSharedOnly && !sharedPicks.includes(iem.id)) return false;

        // Persona & Category matching
        if (currentFilter !== 'all') {
          if (currentFilter === 'Tactical FPS Gaming') {
            if (iem.gaming_score < 8.4) return false;
          } else if (currentFilter === 'Audio Purists & Reference') {
            if (!iem.sound_signature.includes('Neutral') && !iem.name.includes('Hexa') && !iem.name.includes('RED')) return false;
          } else if (currentFilter === 'Bassheads & Theatrical EDM') {
            if (!iem.sound_signature.includes('Bass') && !iem.sound_signature.includes('U-Curve') && !iem.name.includes('ZAR') && !iem.name.includes('Op.22') && !iem.name.includes('Titan X')) return false;
          } else if (currentFilter === 'Smartphone USB-C Users') {
            if (!iem.connection.includes('USB-C') && !iem.connection.includes('DSP')) return false;
          } else if (currentFilter === 'Small Ears & Sleep') {
            if (iem.comfort_rating < 9.0 || iem.nozzle_diameter_mm > 5.5) return false;
          } else if (currentFilter === 'Vocal & Acoustic Lovers') {
            if (!iem.target_personas.some(p => p.includes('Vocal') || p.includes('Acoustic')) && !iem.name.includes("Wan'er") && !iem.name.includes('Cadenza') && !iem.name.includes('Gate')) return false;
          }
        }

        // Search Query
        if (searchQuery) {
          const q = searchQuery;
          const match = iem.name.toLowerCase().includes(q) ||
                        iem.brand.toLowerCase().includes(q) ||
                        iem.driver_type.toLowerCase().includes(q) ||
                        iem.sound_signature.toLowerCase().includes(q) ||
                        (iem.takeaway && iem.takeaway.toLowerCase().includes(q));
          if (!match) return false;
        }

        return true;
      });

      // Sorting
      filtered.sort((a, b) => {
        if (currentSort === 'score-desc') return b.community_score - a.community_score;
        if (currentSort === 'price-ali-asc') return a.price_eur_ali_1111 - b.price_eur_ali_1111;
        if (currentSort === 'price-amazon-asc') return a.price_eur_amazon - b.price_eur_amazon;
        if (currentSort === 'comfort-desc') return b.comfort_rating - a.comfort_rating;
        if (currentSort === 'name-asc') return a.name.localeCompare(b.name);
        return 0;
      });

      resultsCountText.textContent = `Showing ${filtered.length} of ${iemsData.length} sets`;
      emptyState.classList.toggle('hidden', filtered.length > 0);

      // Render Cards
      cardsView.innerHTML = filtered.map(iem => {
        const isFavorited = shortlist.includes(iem.id);
        const hasNote = personalNotes[iem.id];
        const isSmallEarSafe = iem.nozzle_diameter_mm <= 5.5;

        return `
          <div class="studio-card rounded-2xl p-5 flex flex-col justify-between group relative">
            <div>
              <!-- IEM Image Showcase -->
              <div class="aspect-[4/3] bg-studio-950 rounded-xl overflow-hidden mb-4 relative cursor-pointer border border-studio-border/60 flex items-center justify-center p-3" onclick="openModal('${iem.id}')">
                <img src="${iem.image || 'assets/images/' + iem.id + '.jpg'}" alt="${iem.name}" class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300">
                
                <!-- Badge on Image -->
                <div class="absolute top-2.5 left-2.5">
                  ${iem.nozzle_diameter_mm > 6.0 ? `
                    <span class="px-2.5 py-0.5 rounded-md bg-rose-500/20 text-rose-300 border border-rose-500/30 text-xs font-mono font-bold">
                      ⚠️ 6.2mm Nozzle
                    </span>
                  ` : isSmallEarSafe ? `
                    <span class="px-2.5 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 text-xs font-mono font-bold">
                      🌸 Small Ear Safe
                    </span>
                  ` : ''}
                </div>

                <!-- Favorite Bookmark Button -->
                <button type="button" onclick="toggleShortlist('${iem.id}', event)" aria-label="Save to shortlist" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-lg flex items-center justify-center transition ${isFavorited ? 'bg-amber-400 text-black shadow-md' : 'bg-studio-900/80 hover:bg-studio-800 text-slate-300 hover:text-amber-400'} border border-studio-border btn-tactile">
                  <i class="fa-${isFavorited ? 'solid' : 'regular'} fa-bookmark text-sm"></i>
                </button>
              </div>

              <!-- Title & Brand -->
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-mono uppercase text-slate-400 font-bold tracking-wider">${iem.brand}</span>
                <span class="text-xs font-mono text-slate-400">${iem.driver_type}</span>
              </div>
              <h3 class="text-xl font-display font-bold text-white group-hover:text-amber-300 transition cursor-pointer mt-0.5" onclick="openModal('${iem.id}')">
                ${iem.name}
              </h3>

              <!-- Sound Signature Chip -->
              <div class="mt-2.5">
                <span class="inline-block px-3 py-1 rounded-md bg-studio-850 text-amber-300 text-xs font-mono font-semibold border border-studio-border">
                  ${iem.sound_signature}
                </span>
              </div>

              <!-- Human Takeaway Copy -->
              <p class="text-sm text-slate-200 mt-3 leading-relaxed font-sans line-clamp-4">
                ${iem.takeaway || iem.sound_description}
              </p>

              <!-- Fit Verdict -->
              <div class="text-xs font-mono text-slate-300 mt-3 flex items-center gap-1.5">
                <i class="fa-solid fa-ruler-horizontal text-sky-400"></i>
                <span class="truncate">${iem.fit_verdict || (iem.nozzle_diameter_mm + 'mm nozzle')}</span>
              </div>

              ${hasNote ? `
                <div class="mt-3 text-sm p-2.5 rounded-lg bg-amber-400/10 text-amber-200 border border-amber-400/20 italic">
                  <i class="fa-solid fa-pen text-amber-400 mr-1 text-xs"></i> "${hasNote}"
                </div>
              ` : ''}
            </div>

            <!-- Pricing & Action Footer -->
            <div class="mt-5 pt-4 border-t border-studio-border space-y-3">
              <div class="grid grid-cols-2 gap-2 text-sm font-mono">
                <div class="bg-studio-950 p-2.5 rounded-lg border border-studio-border">
                  <span class="text-xs text-slate-400 block uppercase font-mono">Amazon.de</span>
                  <span class="font-bold text-white text-base block mt-0.5">~€${iem.price_eur_amazon}</span>
                </div>
                <div class="bg-emerald-500/10 p-2.5 rounded-lg border border-emerald-500/20">
                  <span class="text-xs text-emerald-400 block uppercase font-mono">11.11 / Choice</span>
                  <span class="font-bold text-emerald-300 text-base block mt-0.5">~€${iem.price_eur_ali_1111}</span>
                </div>
              </div>

              <button type="button" onclick="openModal('${iem.id}')" class="w-full py-2.5 px-3 rounded-lg bg-studio-850 hover:bg-studio-800 text-slate-200 text-sm font-bold transition flex items-center justify-center gap-2 border border-studio-border btn-tactile">
                <i class="fa-solid fa-circle-info text-amber-400"></i>
                <span>Notes, Cables &amp; Stores</span>
              </button>
            </div>
          </div>
        `;
      }).join('');

      // Render Table
      tableBody.innerHTML = filtered.map(iem => {
        const isFavorited = shortlist.includes(iem.id);
        return `
          <tr class="hover:bg-studio-850/60 transition cursor-pointer" onclick="openModal('${iem.id}')">
            <td class="px-4 py-3.5 flex items-center space-x-3">
              <img src="${iem.image || 'assets/images/' + iem.id + '.jpg'}" alt="${iem.name}" class="w-12 h-12 rounded-lg object-contain bg-studio-950 border border-studio-border p-1 shrink-0">
              <div>
                <span class="font-bold text-white text-sm block">${iem.name}</span>
                <span class="text-xs text-slate-400 font-mono">${iem.brand}</span>
              </div>
            </td>
            <td class="px-4 py-3.5 font-mono text-slate-200 text-sm">${iem.driver_type}</td>
            <td class="px-4 py-3.5">
              <span class="px-2.5 py-1 rounded bg-studio-850 text-amber-300 font-mono text-xs border border-studio-border font-semibold">
                ${iem.sound_signature}
              </span>
            </td>
            <td class="px-4 py-3.5 font-mono text-slate-200 text-sm">${iem.nozzle_diameter_mm}mm</td>
            <td class="px-4 py-3.5 font-mono font-bold text-white text-sm">~€${iem.price_eur_amazon}</td>
            <td class="px-4 py-3.5 font-mono font-bold text-emerald-400 text-sm">~€${iem.price_eur_ali_1111}</td>
            <td class="px-4 py-3.5 text-right" onclick="event.stopPropagation()">
              <button type="button" onclick="toggleShortlist('${iem.id}', event)" aria-label="Toggle shortlist item" class="p-2 rounded-lg text-slate-400 hover:text-amber-400 transition">
                <i class="fa-${isFavorited ? 'solid text-amber-400' : 'regular'} fa-bookmark text-sm"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // AUDIOPHILE SOUND BENCH LOGIC (Kessoku Band, YOASOBI, Eurobeat)
    const playlist = [
      {
        id: "L2i0i9gWE00",
        title: "Ano Bando (あのバンド)",
        artist: "Kessoku Band",
        japanese: "結束バンド",
        category: "kessoku",
        categoryLabel: "🎸 Kessoku Band",
        acousticTag: "Guitar Transients & Drum Attack",
        acousticFocus: "Check how the IEM renders the electric guitar crunch, fast drum kick, and high-hat shimmer without sibilance.",
        spotifyUrl: "https://open.spotify.com/search/Ano%20Bando%20Kessoku%20Band"
      },
      {
        id: "B7BxrAAXl94",
        title: "Guitar, Loneliness and Blue Planet",
        artist: "Kessoku Band",
        japanese: "ギターと孤独と蒼い惑星",
        category: "kessoku",
        categoryLabel: "🎸 Kessoku Band",
        acousticTag: "Speed & Dynamic Separation",
        acousticFocus: "Fast punk-rock tempo with aggressive distortion. Analytical sets like Hexa or Gate keep the rhythm tight.",
        spotifyUrl: "https://open.spotify.com/search/Guitar%20Loneliness%20and%20Blue%20Planet"
      },
      {
        id: "Yd8kUoB72xU",
        title: "Seishun Complex (青春コンプレックス)",
        artist: "Kessoku Band",
        japanese: "結束バンド",
        category: "kessoku",
        categoryLabel: "🎸 Kessoku Band",
        acousticTag: "Bassline Articulation & Vocal Energy",
        acousticFocus: "Bouncy bass guitar groove during verses. Warm IEMs like 7Hz Zero:2 and Delci give this track delicious warmth.",
        spotifyUrl: "https://open.spotify.com/search/Seishun%20Complex%20Kessoku%20Band"
      },
      {
        id: "ZRtdQ81jPUQ",
        title: "Idol (アイドル)",
        artist: "YOASOBI",
        japanese: "夜遊び",
        category: "yoasobi",
        categoryLabel: "✨ YOASOBI",
        acousticTag: "High Vocal Energy & Sub-Bass Punch",
        acousticFocus: "Intense J-pop production with rapid pitch shifts. Tests whether female vocals stay sweet or turn shouty.",
        spotifyUrl: "https://open.spotify.com/search/YOASOBI%20Idol"
      },
      {
        id: "j1hft9Wjq9U",
        title: "Yoru ni Kakeru (夜に駆ける)",
        artist: "YOASOBI",
        japanese: "夜遊び",
        category: "yoasobi",
        categoryLabel: "✨ YOASOBI",
        acousticTag: "Piano Timbre & Vocal Sweetness",
        acousticFocus: "Staccato piano chords and intimate vocals. Tangzu Wan'er and Cadenza make Ikura's voice sound lush.",
        spotifyUrl: "https://open.spotify.com/search/YOASOBI%20Yoru%20ni%20Kakeru"
      },
      {
        id: "Y4nEEZwckuU",
        title: "Gunjo (群青)",
        artist: "YOASOBI",
        japanese: "夜遊び",
        category: "yoasobi",
        categoryLabel: "✨ YOASOBI",
        acousticTag: "Choir Harmony & Deep Bass Shelf",
        acousticFocus: "Multi-layered chorus with gospel harmonies. Dual-driver IEMs like Zero:Blue show off their sub-bass depth.",
        spotifyUrl: "https://open.spotify.com/search/YOASOBI%20Gunjo"
      },
      {
        id: "BJ0xBCwkg3E",
        title: "Running in the 90s",
        artist: "Maurizio De Jorio (Initial D)",
        japanese: "頭文字D",
        category: "eurobeat",
        categoryLabel: "🏎️ Eurobeat",
        acousticTag: "Synthetic Kick & Synth Transients",
        acousticFocus: "High BPM synthesizer riffs and punchy electronic drums. Tests bass speed and energy.",
        spotifyUrl: "https://open.spotify.com/search/Running%20in%20the%2090s%20Eurobeat"
      },
      {
        id: "dv13gl0a-FA",
        title: "Deja Vu",
        artist: "Dave Rodgers (Initial D)",
        japanese: "頭文字D",
        category: "eurobeat",
        categoryLabel: "🏎️ Eurobeat",
        acousticTag: "Bass Slam & Stereo Panning",
        acousticFocus: "Aggressive brass synths and heavy bassline. Fun V-shaped sets like KZ ZAR shine here.",
        spotifyUrl: "https://open.spotify.com/search/Dave%20Rodgers%20Deja%20Vu"
      },
      {
        id: "ljwUlY9WW1I",
        title: "Gas Gas Gas",
        artist: "Manuel (Initial D)",
        japanese: "頭文字D",
        category: "eurobeat",
        categoryLabel: "🏎️ Eurobeat",
        acousticTag: "Fast Attack & Vocal Projection",
        acousticFocus: "Maximum high-octane tempo. Tests driver recovery and fast transient response without muddying.",
        spotifyUrl: "https://open.spotify.com/search/Manuel%20Gas%20Gas%20Gas"
      }
    ];

    let currentTrackIdx = 0;
    let isPlaying = false;
    let isYtReady = false;
    let ytPlayer = null;
    let activeDeckCategory = 'all';

    // Player Elements
    const soundDeckPill = document.getElementById('sound-deck-pill');
    const soundDeckPanel = document.getElementById('sound-deck-panel');
    const pillDiscIcon = document.getElementById('pill-disc-icon');
    const pillTrackTitle = document.getElementById('pill-track-title');
    const pillTrackArtist = document.getElementById('pill-track-artist');
    const pillEqBars = document.getElementById('pill-eq-bars');
    const pillPlayBtn = document.getElementById('pill-play-btn');
    const pillPlayIcon = document.getElementById('pill-play-icon');
    const pillExpandBtn = document.getElementById('pill-expand-btn');
    const deckMinimizeBtn = document.getElementById('deck-minimize-btn');
    const deckTrackCategory = document.getElementById('deck-track-category');
    const deckTrackTitle = document.getElementById('deck-track-title');
    const deckTrackArtist = document.getElementById('deck-track-artist');
    const deckDiscIcon = document.getElementById('deck-disc-icon');
    const deckAcousticTag = document.getElementById('deck-acoustic-tag');
    const deckAcousticFocus = document.getElementById('deck-acoustic-focus');
    const deckProgressBar = document.getElementById('deck-progress-bar');
    const deckProgressFill = document.getElementById('deck-progress-fill');
    const deckTimeCurrent = document.getElementById('deck-time-current');
    const deckTimeDuration = document.getElementById('deck-time-duration');
    const deckPrevBtn = document.getElementById('deck-prev-btn');
    const deckPlayBtn = document.getElementById('deck-play-btn');
    const deckPlayIcon = document.getElementById('deck-play-icon');
    const deckNextBtn = document.getElementById('deck-next-btn');
    const deckVolumeSlider = document.getElementById('deck-volume-slider');
    const deckVolumeIcon = document.getElementById('deck-volume-icon');
    const deckMuteBtn = document.getElementById('deck-mute-btn');
    const deckPlaylistContainer = document.getElementById('deck-playlist-container');
    const deckSpotifyLink = document.getElementById('deck-spotify-link');
    const deckCatButtons = document.querySelectorAll('.deck-cat-btn');

    // YouTube API init
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('yt-player', {
        height: '10',
        width: '10',
        videoId: playlist[currentTrackIdx].id,
        playerVars: {
          playsinline: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          rel: 0
        },
        events: {
          onReady: () => {
            isYtReady = true;
            ytPlayer.setVolume(75);
          },
          onStateChange: (event) => {
            if (event.data === YT.PlayerState.PLAYING) {
              isPlaying = true;
              setPlayingVisuals(true);
            } else if (event.data === YT.PlayerState.PAUSED) {
              isPlaying = false;
              setPlayingVisuals(false);
            } else if (event.data === YT.PlayerState.ENDED) {
              playNextTrack();
            }
          },
          onError: (event) => {
            console.warn('YouTube Player reported error:', event.data);
            setPlayingVisuals(false);
            playNextTrack();
          }
        }
      });
    };

    function setPlayingVisuals(playing) {
      if (playing) {
        pillPlayIcon.className = 'fa-solid fa-pause';
        deckPlayIcon.className = 'fa-solid fa-pause';
        pillDiscIcon.classList.add('spinning-disc');
        deckDiscIcon.classList.add('spinning-disc');
        pillEqBars.classList.remove('hidden');
      } else {
        pillPlayIcon.className = 'fa-solid fa-play';
        deckPlayIcon.className = 'fa-solid fa-play';
        pillDiscIcon.classList.remove('spinning-disc');
        deckDiscIcon.classList.remove('spinning-disc');
        pillEqBars.classList.add('hidden');
      }
    }

    // Time ticker
    setInterval(() => {
      if (isPlaying && ytPlayer && ytPlayer.getCurrentTime) {
        const cur = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || 0;
        if (dur > 0) {
          deckProgressFill.style.width = `${(cur / dur) * 100}%`;
          deckTimeCurrent.textContent = formatTime(cur);
          deckTimeDuration.textContent = formatTime(dur);
        }
      }
    }, 500);

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateTrackDisplay(autoPlay = false) {
      const track = playlist[currentTrackIdx];
      pillTrackTitle.textContent = track.title;
      pillTrackArtist.textContent = track.artist;
      deckTrackTitle.textContent = track.title;
      deckTrackArtist.textContent = `${track.artist} (${track.japanese})`;
      deckTrackCategory.textContent = track.categoryLabel;
      deckAcousticTag.textContent = track.acousticTag;
      deckAcousticFocus.textContent = track.acousticFocus;
      deckSpotifyLink.href = track.spotifyUrl;

      renderDeckPlaylist();

      if (isYtReady && ytPlayer) {
        if (autoPlay) {
          ytPlayer.loadVideoById(track.id);
          isPlaying = true;
          setPlayingVisuals(true);
        } else {
          ytPlayer.cueVideoById(track.id);
        }
      }
    }

    function togglePlay() {
      if (!isYtReady || !ytPlayer) {
        // Player still connecting or loading
        pillPlayIcon.className = 'fa-solid fa-spinner animate-spin text-amber-400';
        return;
      }
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    window.playDeckTrack = function(idx) {
      currentTrackIdx = idx;
      updateTrackDisplay(true);
    };

    function playNextTrack() {
      currentTrackIdx = (currentTrackIdx + 1) % playlist.length;
      updateTrackDisplay(true);
    }

    function playPrevTrack() {
      currentTrackIdx = (currentTrackIdx - 1 + playlist.length) % playlist.length;
      updateTrackDisplay(true);
    }

    function renderDeckPlaylist() {
      const filtered = playlist.map((t, idx) => ({ ...t, originalIndex: idx }))
        .filter(t => activeDeckCategory === 'all' || t.category === activeDeckCategory);

      deckPlaylistContainer.innerHTML = filtered.map(track => {
        const isCurrent = track.originalIndex === currentTrackIdx;
        return `
          <div onclick="playDeckTrack(${track.originalIndex})" class="flex items-center justify-between p-2.5 rounded-lg cursor-pointer transition text-sm ${isCurrent ? 'bg-amber-400/20 text-white font-bold border border-amber-400/30' : 'bg-studio-900 text-slate-300 hover:text-white border border-studio-border'}">
            <div class="flex items-center space-x-2 min-w-0">
              <span class="w-5 text-center font-mono text-xs ${isCurrent ? 'text-amber-400 font-bold' : 'text-slate-400'}">
                ${isCurrent && isPlaying ? '<i class=\"fa-solid fa-volume-high animate-pulse text-amber-400\"></i>' : (track.originalIndex + 1)}
              </span>
              <div class="min-w-0">
                <span class="block truncate text-sm">${track.title}</span>
                <span class="block text-xs text-slate-400 font-mono truncate">${track.artist}</span>
              </div>
            </div>
            <span class="text-xs font-mono px-2 py-0.5 rounded bg-studio-950 text-slate-300 border border-studio-border ml-2 shrink-0">
              ${track.acousticTag.split('&')[0]}
            </span>
          </div>
        `;
      }).join('');
    }

    // Scrubber click
    deckProgressBar.addEventListener('click', (e) => {
      if (!ytPlayer || !ytPlayer.getDuration) return;
      const rect = deckProgressBar.getBoundingClientRect();
      const clickPos = (e.clientX - rect.left) / rect.width;
      const dur = ytPlayer.getDuration();
      if (dur > 0) {
        ytPlayer.seekTo(clickPos * dur, true);
      }
    });

    // Volume Slider
    deckVolumeSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(val);
      }
      if (val === 0) {
        deckVolumeIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
      } else if (val < 50) {
        deckVolumeIcon.className = 'fa-solid fa-volume-low text-slate-300';
      } else {
        deckVolumeIcon.className = 'fa-solid fa-volume-high text-slate-300';
      }
    });

    deckMuteBtn.addEventListener('click', () => {
      if (!ytPlayer) return;
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        deckVolumeSlider.value = ytPlayer.getVolume() || 75;
        deckVolumeIcon.className = 'fa-solid fa-volume-high text-slate-300';
      } else {
        ytPlayer.mute();
        deckVolumeSlider.value = 0;
        deckVolumeIcon.className = 'fa-solid fa-volume-xmark text-rose-400';
      }
    });

    // Deck categories
    deckCatButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        deckCatButtons.forEach(b => {
          b.classList.remove('active', 'bg-amber-400', 'text-black', 'font-bold');
          b.classList.add('bg-studio-850', 'text-slate-300');
        });
        btn.classList.add('active', 'bg-amber-400', 'text-black', 'font-bold');
        btn.classList.remove('bg-studio-850', 'text-slate-300');
        activeDeckCategory = btn.dataset.cat;
        renderDeckPlaylist();
      });
    });

    // Deck open/close
    pillPlayBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });
    deckPlayBtn.addEventListener('click', togglePlay);
    deckPrevBtn.addEventListener('click', playPrevTrack);
    deckNextBtn.addEventListener('click', playNextTrack);

    function expandSoundDeck() {
      soundDeckPill.classList.add('hidden');
      soundDeckPanel.classList.remove('hidden');
    }
    function minimizeSoundDeck() {
      soundDeckPanel.classList.add('hidden');
      soundDeckPill.classList.remove('hidden');
    }

    soundDeckPill.addEventListener('click', expandSoundDeck);
    pillExpandBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      expandSoundDeck();
    });
    deckMinimizeBtn.addEventListener('click', minimizeSoundDeck);

    // Initializations
    updateTrackDisplay(false);
    updateShortlistUI();
    render();
  </script>
</body>
</html>
