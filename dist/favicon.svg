<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="earbudGrad" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="18" fill="#0d111a" stroke="url(#earbudGrad)" stroke-width="2.5" />
  
  <!-- Subtle inner radial glow -->
  <circle cx="32" cy="32" r="24" fill="#38bdf8" opacity="0.08" />

  <!-- Cute Chibi IEM Earbud Contour -->
  <path d="M22 38 C20 28 26 18 36 18 C46 18 50 25 50 35 C50 45 42 49 32 49 C25 49 22 45 22 38 Z" 
        fill="url(#earbudGrad)" />
        
  <!-- Faceplate inner gloss -->
  <path d="M25 36 C24 30 28 22 35 22 C41 22 44 26 44 33 C44 40 38 44 31 44 C26 44 25 40 25 36 Z" 
        fill="#0d111a" opacity="0.85" />
        
  <!-- Cable Pin Jack & Stem -->
  <path d="M19 44 L15 50" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="19" cy="44" r="2.5" fill="#f43f5e" />

  <!-- Cute Chibi Sparkle / Star (Top Right) -->
  <path d="M48 14 L49.5 19 L54.5 20.5 L49.5 22 L48 27 L46.5 22 L41.5 20.5 L46.5 19 Z" 
        fill="#fde047" filter="url(#glow)" />
        
  <!-- Tiny Love Heart / Acoustic Pulse (Bottom Right) -->
  <path d="M44 42 C44 39.5 41.5 38 39.5 40 C37.5 38 35 39.5 35 42 C35 45.5 39.5 48.5 39.5 48.5 C39.5 48.5 44 45.5 44 42 Z" 
        fill="#f43f5e" />
</svg>
